<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Médicu CI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0fdfa;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Columna Izquierda: Imagen y Bienvenida */
        .left-banner {
            flex: 1.2;
            position: relative;
            background: linear-gradient(rgba(15, 118, 110, 0.4), rgb(18 207 194 / 0.7)),
            url('wi.avif') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 50px;
            color: #dddcdc;
        }

        .left-banner-content h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .left-banner-content p {
            font-size: 15px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .banner-features {
            display: flex;
            gap: 25px;
            font-size: 13px;
            opacity: 0.85;
            font-weight: 500;
        }

        /* Columna Derecha: Formulario de Login */
        .right-form {
            flex: 1;
            background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-card {
            background-color: #ffffff;
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(13, 148, 136, 0.08);
            width: 100%;
            max-width: 420px;
            border: 1px solid #ccfbf1;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-header h2 {
            font-size: 24px;
            color: #0f766e;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 13px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            color: #0f172a;
        }

        .form-group input:focus {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: #0d9488;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .btn-submit:hover {
            background-color: #004943;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
        }

        .message.error {
            color: #dc2626;
            background-color: #fef2f2;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #fee2e2;
        }

        .message.success {
            color: #66ccaa;
            background-color: #ecfdf5;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #a7f3d0;
        }

        .security-note {
            text-align: center;
            margin-top: 24px;
            font-size: 20px;
            color: #94a3b8;
        }

        @media (max-width: 900px) {
            .left-banner {
                display: none;
            }
            .right-form {
                flex: 1;
                background: #f0fdfa;
            }
        }
    </style>
</head>
<body>

<div class="left-banner">
    <div class="left-banner-content">
        <h1>Tu salud, organizada en un solo lugar</h1>
        <p>Accede de forma rápida y segura a tus citas médicas y a tu historial clínico.</p>
        <div class="banner-features">
            <span>Agenda en segundos</span>
            <span>Atención segura 24/7</span>
        </div>
    </div>
</div>

<div class="right-form">
    <div class="login-card">
        <div class="brand-header">
            <h2>Hospital CI</h2>
            <p>Inicie sesión please</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@clinica.pe" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Verificars</button>
        </form>

        <div id="formMessage" class="message"></div>

        <div class="security-note">
            Conexión segura y datos protegidos
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const messageDiv = document.getElementById('formMessage');

        if (email === "" || password === "") {
            messageDiv.textContent = "Por favor, complete todos los campos.";
            messageDiv.className = "message error";
            return;
        }

        fetch('http://localhost:8080/usuario/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        })
            .then(response => {
                if (response.ok) {
                    return response.json().then(data => {
                        messageDiv.textContent = "¡Inicio de sesión exitoso! siuu";
                        messageDiv.className = "message success";

                        const usuarioLogueado = data.usuario;
                        const token = data.token;

                        if (usuarioLogueado) {
                            usuarioLogueado.token = token;
                        }

                        localStorage.setItem('usuarioLogueado', JSON.stringify(usuarioLogueado));
                        localStorage.setItem('token', token);

                        const idRol = (usuarioLogueado && usuarioLogueado.rol) ? usuarioLogueado.rol.idRol : null;

                        setTimeout(() => {
                            if (idRol === 1) {
                                window.location.href = "index1.html";
                            } else {
                                window.location.href = "index2.html";
                            }
                        }, 1200);
                    });
                } else {
                    messageDiv.textContent = "Correo o contraseña incorrectos.";
                    messageDiv.className = "message error";
                }
            })
            .catch(error => {
                console.error("Error:", error);
                messageDiv.textContent = "No se pudo conectar con el servidor.";
                messageDiv.className = "message error";
            });
    });
</script>

</body>
</html>
