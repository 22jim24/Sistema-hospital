<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal del Paciente - Médicu CI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0fdfa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
      color: #1e293b;
    }

    .main-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .header-panel {
      background-color: #ffffff;
      padding: 25px 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.08);
      border: 1px solid #ccfbf1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h2 {
      color: #0f766e;
      font-size: 22px;
      font-weight: 700;
    }

    .btn-logout {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      padding: 9px 16px;
      border-radius: 8px;
      color: #dc2626;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-logout:hover {
      background-color: #dc2626;
      color: white;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
    }

    .content-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 25px;
      align-items: start;
    }

    .card-section {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.08);
      border: 1px solid #ccfbf1;
      animation: fadeIn 0.4s ease-out;
    }

    .section-title {
      color: #0f766e;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0fdfa;
    }

    .sidebar-panel {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(13, 148, 136, 0.08);
      border: 1px solid #ccfbf1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f766e;
      border-bottom: 2px solid #f0fdfa;
      padding-bottom: 8px;
      margin-bottom: 5px;
    }

    .nav-btn {
      width: 100%;
      padding: 12px 15px;
      background-color: #f0fdfa;
      border: 1.5px solid #ccfbf1;
      border-radius: 10px;
      color: #0f766e;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .nav-btn:hover {
      background-color: #ccfbf1;
      border-color: #0d9488;
    }

    .nav-btn.active {
      background-color: #0d9488;
      color: white;
      border-color: #0d9488;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
    }

    .vista-seccion {
      display: none;
    }

    .vista-seccion.activo {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: #0d9488;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 5px;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
    }

    .btn-submit:hover {
      background-color: #0f766e;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
      border-radius: 8px;
    }

    .message.error {
      color: #dc2626;
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
    }

    .message.success {
      color: #059669;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
    }

    .table-wrapper {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      margin-top: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      font-size: 13px;
    }

    th {
      background-color: #f0fdfa;
      color: #0f766e;
      font-weight: 600;
      border-bottom: 1px solid #ccfbf1;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background-color 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    .badge-estado {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
    }
    .badge-esperando { background-color: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
    .badge-confirmada { background-color: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .badge-cancelada { background-color: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
    .badge-completada { background-color: #f0fdfa; color: #0d9488; border: 1px solid #ccfbf1; }

    /* Estilos para el Dashboard simple */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .dash-card {
      background-color: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dash-card.esperando { border-color: #fde68a; background-color: #fffbeb; }
    .dash-card.confirmada { border-color: #a7f3d0; background-color: #ecfdf5; }
    .dash-card.cancelada { border-color: #fee2e2; background-color: #fef2f2; }
    .dash-card.completada { border-color: #ccfbf1; background-color: #f0fdfa; }

    .dash-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dash-card.esperando .dash-title { color: #d97706; }
    .dash-card.confirmada .dash-title { color: #059669; }
    .dash-card.cancelada .dash-title { color: #dc2626; }
    .dash-card.completada .dash-title { color: #0d9488; }

    .dash-number {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="header-panel">
    <h2 id="bienvenidaPaciente">Portal del Paciente - Médicu CI</h2>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <div class="content-grid">

    <div class="sidebar-panel">
      <div class="sidebar-title">Menú del Paciente</div>
      <button class="nav-btn active" id="btnMenuReservar" onclick="cambiarVista('reservar')">Registrar Cita</button>
      <button class="nav-btn" id="btnMenuHistorial" onclick="cambiarVista('historial')">Historial de Citas</button>
      <button class="nav-btn" id="btnMenuDashboard" onclick="cambiarVista('dashboard')">Análisis y Dashboard</button>
    </div>

    <div>
      <div id="seccionReservar" class="card-section vista-seccion activo">
        <div class="section-title">Registrar Cita Médica</div>

        <form id="bookingForm">
          <div class="form-group">
            <label for="sede">Sede</label>
            <select id="sede" required>
              <option value="">Cargando sedes...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="especialidad">Especialidad</label>
            <select id="especialidad" required>
              <option value="">Cargando especialidades...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="medico">Médico</label>
            <select id="medico" required>
              <option value="">Cargando médicos...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="turno">Turno</label>
            <select id="turno" required>
              <option value="">Cargando turnos...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fechaHora">Fecha y Hora específica</label>
            <input type="datetime-local" id="fechaHora" required>
            <small id="turnoInfo" style="color: #0d9488; font-weight: 500; font-size: 11px; display: block; margin-top: 6px;"></small>
          </div>

          <button type="submit" class="btn-submit">Confirmar y Reservar Cita</button>
        </form>
        <div id="formMessage" class="message"></div>
      </div>

      <div id="seccionHistorial" class="card-section vista-seccion">
        <div class="section-title">Historial de Citas</div>
        <div class="table-wrapper">
          <table>
            <thead>
            <tr>
              <th>ID</th>
              <th>Fecha y Hora</th>
              <th>Estado</th>
              <th>Sede</th>
              <th>Médico</th>
            </tr>
            </thead>
            <tbody id="tablaCitasBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #64748b; padding: 30px;">Cargando citas...</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="seccionDashboard" class="card-section vista-seccion">
        <div class="section-title">Análisis y Resumen de Citas</div>
        <div class="dashboard-grid">
          <div class="dash-card esperando">
            <div class="dash-title">Esperando</div>
            <div class="dash-number" id="countEsperando">0</div>
          </div>
          <div class="dash-card confirmada">
            <div class="dash-title">Confirmada</div>
            <div class="dash-number" id="countConfirmada">0</div>
          </div>
          <div class="dash-card cancelada">
            <div class="dash-title">Cancelada</div>
            <div class="dash-number" id="countCancelada">0</div>
          </div>
          <div class="dash-card completada">
            <div class="dash-title">Completada</div>
            <div class="dash-number" id="countCompletada">0</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  let listaTurnosGlobal = [];
  let listaCitasGlobal = [];

  document.addEventListener("DOMContentLoaded", function() {
    validarSesionPaciente();
    cargarDatosCombos();
    cargarCitasPaciente();
  });

  function cambiarVista(vista) {
    const seccionReservar = document.getElementById('seccionReservar');
    const seccionHistorial = document.getElementById('seccionHistorial');
    const seccionDashboard = document.getElementById('seccionDashboard');
    const btnMenuReservar = document.getElementById('btnMenuReservar');
    const btnMenuHistorial = document.getElementById('btnMenuHistorial');
    const btnMenuDashboard = document.getElementById('btnMenuDashboard');

    seccionReservar.classList.remove('activo');
    seccionHistorial.classList.remove('activo');
    seccionDashboard.classList.remove('activo');
    btnMenuReservar.classList.remove('active');
    btnMenuHistorial.classList.remove('active');
    btnMenuDashboard.classList.remove('active');

    if (vista === 'reservar') {
      seccionReservar.classList.add('activo');
      btnMenuReservar.classList.add('active');
    } else if (vista === 'historial') {
      seccionHistorial.classList.add('activo');
      btnMenuHistorial.classList.add('active');
      cargarCitasPaciente();
    } else if (vista === 'dashboard') {
      seccionDashboard.classList.add('activo');
      btnMenuDashboard.classList.add('active');
      cargarCitasPaciente();
    }
  }

  function obtenerHeaders() {
    const usuarioLogueado = JSON.parse(localStorage.getItem('usuarioLogueado'));
    const token = usuarioLogueado ? usuarioLogueado.token : '';
    return {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    };
  }

  function validarSesionPaciente() {
    const usuarioLogueado = JSON.parse(localStorage.getItem('usuarioLogueado'));
    if (!usuarioLogueado) {
      window.location.href = "index.html";
      return;
    }
    document.getElementById('bienvenidaPaciente').textContent = `Portal del Paciente - ${usuarioLogueado.email}`;
  }

  function cargarDatosCombos() {
    const headers = obtenerHeaders();

    fetch('http://localhost:8080/sede', { headers })
            .then(res => res.ok ? res.json() : Promise.reject("Error en sedes"))
            .then(data => {
              const selectSede = document.getElementById('sede');
              selectSede.innerHTML = '<option value="">Seleccione una sede...</option>';
              data.forEach(sede => {
                selectSede.innerHTML += `<option value="${sede.idSede}">${sede.nombreSede}</option>`;
              });
            })
            .catch(err => console.error("Error cargando sedes:", err));

    fetch('http://localhost:8080/especialidad', { headers })
            .then(res => res.ok ? res.json() : Promise.reject("Error en especialidades"))
            .then(data => {
              const selectEsp = document.getElementById('especialidad');
              selectEsp.innerHTML = '<option value="">Seleccione una especialidad...</option>';
              data.forEach(esp => {
                selectEsp.innerHTML += `<option value="${esp.idEspecialidad}">${esp.nombreEspecialidad}</option>`;
              });
            })
            .catch(err => console.error("Error cargando especialidades:", err));

    fetch('http://localhost:8080/medico', { headers })
            .then(res => res.ok ? res.json() : Promise.reject("Error al cargar médicos"))
            .then(data => {
              const selectMed = document.getElementById('medico');
              selectMed.innerHTML = '<option value="">Seleccione un médico...</option>';
              data.forEach(med => {
                selectMed.innerHTML += `<option value="${med.idMedico}">${med.nombre} ${med.apellido}</option>`;
              });
            })
            .catch(err => console.error("Error cargando médicos:", err));

    fetch('http://localhost:8080/turno', { headers })
            .then(res => res.ok ? res.json() : Promise.reject("Error en turnos"))
            .then(data => {
              listaTurnosGlobal = data;
              const selectTurno = document.getElementById('turno');
              selectTurno.innerHTML = '<option value="">Seleccione un turno...</option>';
              data.forEach(turno => {
                selectTurno.innerHTML += `<option value="${turno.idTurno}">${turno.nombreTurno} (${turno.horaInicio} - ${turno.horaFin})</option>`;
              });
            })
            .catch(err => console.error("Error cargando turnos:", err));
  }

  document.getElementById('turno').addEventListener('change', function() {
    const idTurnoSeleccionado = this.value;
    const turnoInfo = document.getElementById('turnoInfo');

    if (!idTurnoSeleccionado) {
      turnoInfo.textContent = "";
      return;
    }

    const turnoElegido = listaTurnosGlobal.find(t => t.idTurno == idTurnoSeleccionado);
    if (turnoElegido) {
      turnoInfo.textContent = `Horario permitido para este turno: de ${turnoElegido.horaInicio} a ${turnoElegido.horaFin}`;
    }
  });

  function cargarCitasPaciente() {
    const usuarioLogueado = JSON.parse(localStorage.getItem('usuarioLogueado'));
    if (!usuarioLogueado) return;

    const headers = obtenerHeaders();

    fetch('http://localhost:8080/paciente', { headers })
            .then(res => res.ok ? res.json() : Promise.reject("Error al obtener pacientes"))
            .then(pacientes => {
              const pacienteEncontrado = pacientes.find(p => p.usuario && p.usuario.idUsuario === usuarioLogueado.idUsuario);

              if (!pacienteEncontrado) {
                document.getElementById('tablaCitasBody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 25px;">No se encontró perfil de paciente asociado.</td></tr>';
                return;
              }

              localStorage.setItem('idPacienteLogueado', pacienteEncontrado.idPaciente);

              return fetch(`http://localhost:8080/cita/paciente/${pacienteEncontrado.idPaciente}`, { headers });
            })
            .then(res => {
              if (!res) return;
              return res.ok ? res.json() : Promise.reject("Error al cargar citas del paciente");
            })
            .then(data => {
              if (!data) return;
              listaCitasGlobal = data;
              renderizarHistorial(data);
              actualizarDashboard(data);
            })
            .catch(err => console.error("Error al cargar citas:", err));
  }

  function renderizarHistorial(data) {
    const tbody = document.getElementById('tablaCitasBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 25px;">No tienes citas registradas.</td></tr>';
      return;
    }

    data.forEach(cita => {
      const nombreSede = cita.sede ? cita.sede.nombreSede : 'N/A';
      const nombreMedico = cita.medico ? `${cita.medico.nombre} ${cita.medico.apellido}` : 'N/A';

      let textoEstado = cita.estadoCita;
      let badgeClass = "badge-esperando";
      if (cita.estadoCita === 0 || cita.estadoCita === "ESPERANDO") { textoEstado = "ESPERANDO"; badgeClass = "badge-esperando"; }
      else if (cita.estadoCita === 1 || cita.estadoCita === "CONFIRMADA") { textoEstado = "CONFIRMADA"; badgeClass = "badge-confirmada"; }
      else if (cita.estadoCita === 2 || cita.estadoCita === "CANCELADA") { textoEstado = "CANCELADA"; badgeClass = "badge-cancelada"; }
      else if (cita.estadoCita === 3 || cita.estadoCita === "COMPLETADA") { textoEstado = "COMPLETADA"; badgeClass = "badge-completada"; }

      tbody.innerHTML += `
        <tr>
            <td style="font-weight: 600; color: #0f766e;">#${cita.idCita}</td>
            <td>${cita.fechaHora}</td>
            <td><span class="badge-estado ${badgeClass}">${textoEstado}</span></td>
            <td>${nombreSede}</td>
            <td>${nombreMedico}</td>
        </tr>
      `;
    });
  }

  function actualizarDashboard(data) {
    let esperando = 0;
    let confirmada = 0;
    let cancelada = 0;
    let completada = 0;

    data.forEach(cita => {
      const estado = cita.estadoCita;
      if (estado === 0 || estado === "ESPERANDO") {
        esperando++;
      } else if (estado === 1 || estado === "CONFIRMADA") {
        confirmada++;
      } else if (estado === 2 || estado === "CANCELADA") {
        cancelada++;
      } else if (estado === 3 || estado === "COMPLETADA") {
        completada++;
      }
    });

    document.getElementById('countEsperando').textContent = esperando;
    document.getElementById('countConfirmada').textContent = confirmada;
    document.getElementById('countCancelada').textContent = cancelada;
    document.getElementById('countCompletada').textContent = completada;
  }

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const sedeId = document.getElementById('sede').value;
    const medicoId = document.getElementById('medico').value;
    const turnoId = document.getElementById('turno').value;
    const fechaHoraInput = document.getElementById('fechaHora').value;
    const messageDiv = document.getElementById('formMessage');

    const turnoElegido = listaTurnosGlobal.find(t => t.idTurno == turnoId);
    if (turnoElegido) {
      const horaSeleccionada = fechaHoraInput.split('T')[1];
      const horaSelCorta = horaSeleccionada.substring(0, 5);
      const horaIniCorta = turnoElegido.horaInicio.substring(0, 5);
      const horaFinCorta = turnoElegido.horaFin.substring(0, 5);

      if (horaSelCorta < horaIniCorta || horaSelCorta > horaFinCorta) {
        messageDiv.textContent = `Error: La hora elegida (${horaSelCorta}) no corresponde al turno seleccionado (${horaIniCorta} - ${horaFinCorta}).`;
        messageDiv.className = "message error";
        return;
      }
    }

    const idPaciente = localStorage.getItem('idPacienteLogueado');
    if (!idPaciente) {
      messageDiv.textContent = "Error: No se encontró el ID del paciente.";
      messageDiv.className = "message error";
      return;
    }

    let fechaHoraFormateada = fechaHoraInput;
    if (fechaHoraFormateada.length === 16) {
      fechaHoraFormateada += ":00";
    }

    const nuevaCita = {
      fechaHora: fechaHoraFormateada,
      estadoCita: 0,
      sede: { idSede: parseInt(sedeId) },
      medico: { idMedico: parseInt(medicoId) },
      paciente: { idPaciente: parseInt(idPaciente) }
    };

    fetch('http://localhost:8080/cita', {
      method: 'POST',
      headers: obtenerHeaders(),
      body: JSON.stringify(nuevaCita)
    })
            .then(async response => {
              if (response.ok) {
                messageDiv.textContent = "Cita reservada exitosamente";
                messageDiv.className = "message success";
                document.getElementById('bookingForm').reset();
                document.getElementById('turnoInfo').textContent = "";
                cargarCitasPaciente();
              } else {
                const errText = await response.text();
                console.error("Detalle del error:", errText);
                messageDiv.textContent = "Error al registrar la cita.";
                messageDiv.className = "message error";
              }
            })
            .catch(error => {
              console.error("Error:", error);
              messageDiv.textContent = "No se pudo conectar con el servidor.";
              messageDiv.className = "message error";
            });
  });

  function cerrarSesion() {
    localStorage.removeItem('usuarioLogueado');
    localStorage.removeItem('token');
    localStorage.removeItem('idPacienteLogueado');
    window.location.href = "index.html";
  }
</script>

</body>
</html>
